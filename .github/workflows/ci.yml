# Baysöz Labs <baysozlabs@proton.me> — baysoz-provenancegate
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install tooling
        run: |
          python -m pip install --upgrade uv ruff semgrep pytest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Create environment and install package
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest
      - name: Tests
        run: uv run pytest -q
      - name: Static analysis
        run: ruff check --select E,F,W,S,B .
      - name: Security analysis
        run: semgrep --config p/default --error .
